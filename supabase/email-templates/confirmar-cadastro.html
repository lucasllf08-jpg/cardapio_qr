<div style="background:#f4f5f7;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden">
    <div style="background:#101010;color:#ffffff;padding:20px 28px;font-size:18px;font-weight:bold">Cardápio Digital</div>
    <div style="padding:28px;color:#16181d;font-size:16px;line-height:1.5">
      <h1 style="margin:0 0 12px;font-size:22px">Confirme seu e-mail</h1>
      <p style="margin:0">Falta só um passo para ativar sua conta. Clique no botão abaixo para confirmar este e-mail.</p>
      <p style="margin:28px 0">
        <a href="{{ .ConfirmationURL }}" style="background:#f0280f;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 24px;border-radius:12px;display:inline-block">Confirmar e-mail</a>
      </p>
      <p style="margin:0 0 8px;color:#6b7280;font-size:14px">Se o botão não funcionar, copie e cole este link no navegador:<br>{{ .ConfirmationURL }}</p>
      <p style="margin:0;color:#6b7280;font-size:14px">Se você não criou uma conta, ignore esta mensagem.</p>
    </div>
  </div>
</div>
